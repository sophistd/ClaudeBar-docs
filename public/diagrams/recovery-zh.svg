<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" xml:lang="zh-CN" role="img" aria-labelledby="recovery-zh-title recovery-zh-desc">
  <!-- [INPUT]: diagram-source.mjs 双语机制与 Geist 视觉标尺。
       [OUTPUT]: recovery 的 zh 静态机制图。
       [POS]: public/diagrams 的生成资源。
       [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md -->
  <title id="recovery-zh-title">门禁进入宽限期后的判断</title>
  <desc id="recovery-zh-desc">链路中断后，新握手等待。观测到的出口身份匹配时恢复放行。到期时若无新观测且无探测拒绝，沿用旧基线恢复，本次没有重新核验。实测出口漂移会立即隔离，记录探测拒绝后到期也会隔离。</desc>
  <defs><marker id="recovery-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="m2 1 6 4-6 4"/></marker></defs>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --surface: #fafafa; --border: #e6e6e6; --ink: #171717; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --surface: #0a0a0a; --border: #333; --ink: #ededed; --muted: #a1a1a1; } }
    text { font: 15px Geist, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .small { font-size: 13px; }
    .secondary { fill: var(--muted); }
    .center { text-anchor: middle; }
    .node { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .route, .control, .arrow { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
    .control { stroke: var(--muted); stroke-dasharray: 4 4; }
    .rule { stroke: var(--border); }
    .endpoint { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; }
    .junction { fill: var(--ink); }
  </style>
  <rect width="780" height="330" fill="var(--bg)"/><rect class="node" x="24" y="137" width="124" height="56" rx="6"/><text x="86" y="170" class="center">放行</text>
    <rect class="node" x="208" y="137" width="150" height="56" rx="6"/><text x="283" y="170" class="center">新握手等待</text>
    <path class="route" d="M148 165H202" marker-end="url(#recovery-zh-arrow)"/>
    <text x="176" y="125" class="center secondary small">链路中断</text>
    <path class="route" d="M358 165H382V54H622" marker-end="url(#recovery-zh-arrow)"/>
    <path class="route" d="M382 165V276H622" marker-end="url(#recovery-zh-arrow)"/>
    <circle class="junction" cx="382" cy="165" r="3"/>
    <rect class="node" x="628" y="26" width="128" height="56" rx="6"/><text x="692" y="59" class="center">放行</text>
    <rect class="node" x="628" y="248" width="128" height="56" rx="6"/><text x="692" y="281" class="center">隔离</text>
    <text x="404" y="40" class="small">出口身份匹配</text>
    <path class="control" d="M382 112H610V54H622" marker-end="url(#recovery-zh-arrow)"/>
    <text x="404" y="98" class="small">无新观测、无拒绝</text>
    <text x="404" y="138" class="secondary small">到期沿用旧基线</text>
    <path class="route" d="M382 216H610V276H622" marker-end="url(#recovery-zh-arrow)"/>
    <text x="404" y="202" class="small">实测出口漂移</text>
    <text x="404" y="262" class="small">宽限到期仍被拒</text>
</svg>
