<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" xml:lang="zh-CN" role="img" aria-labelledby="recovery-zh-title recovery-zh-desc">
  <!-- [INPUT]: diagram-source.mjs 的双语标注与机制形元。
