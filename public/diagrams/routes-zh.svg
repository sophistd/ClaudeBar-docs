<svg xmlns="http://www.w3.org/2000/svg" width="780" height="326" viewBox="0 0 780 326" xml:lang="zh-CN" role="img" aria-labelledby="routes-zh-title routes-zh-desc">
  <!-- [INPUT]: diagram-source.mjs 的双语标注与机制形元。
       [OUTPUT]: routes 的 zh 静态图解。
