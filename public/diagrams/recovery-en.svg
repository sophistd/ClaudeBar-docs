<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" xml:lang="en" role="img" aria-labelledby="recovery-en-title recovery-en-desc">
  <!-- [INPUT]: diagram-source.mjs 双语机制与 Geist 视觉标尺。
       [OUTPUT]: recovery 的 en 静态机制图。
       [POS]: public/diagrams 的生成资源。
       [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md -->
  <title id="recovery-en-title">Gate decisions during a hold</title>
  <desc id="recovery-en-desc">New handshakes wait after an interruption. A matching observation resumes admission. Expiry with no new observation and no probe rejection reuses the prior baseline without reverification. Measured drift isolates immediately, and expiry after a recorded rejection also isolates.</desc>
  <defs><marker id="recovery-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="m2 1 6 4-6 4"/></marker></defs>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --surface: #fafafa; --border: #e6e6e6; --ink: #171717; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --surface: #0a0a0a; --border: #333; --ink: #ededed; --muted: #a1a1a1; } }
    text { font: 15px Geist, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .small { font-size: 13px; }
    .secondary { fill: var(--muted); }
    .center { text-anchor: middle; }
    .node { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .route, .control, .arrow { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
    .control { stroke: var(--muted); stroke-dasharray: 4 4; }
    .rule { stroke: var(--border); }
    .endpoint { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; }
    .junction { fill: var(--ink); }
  </style>
  <rect width="780" height="330" fill="var(--bg)"/><rect class="node" x="24" y="137" width="124" height="56" rx="6"/><text x="86" y="170" class="center">Armed</text>
    <rect class="node" x="208" y="137" width="150" height="56" rx="6"/><text x="283" y="170" class="center">Handshakes wait</text>
    <path class="route" d="M148 165H202" marker-end="url(#recovery-en-arrow)"/>
    <text x="176" y="125" class="center secondary small">Interruption</text>
    <path class="route" d="M358 165H382V54H622" marker-end="url(#recovery-en-arrow)"/>
    <path class="route" d="M382 165V276H622" marker-end="url(#recovery-en-arrow)"/>
    <circle class="junction" cx="382" cy="165" r="3"/>
    <rect class="node" x="628" y="26" width="128" height="56" rx="6"/><text x="692" y="59" class="center">Armed</text>
    <rect class="node" x="628" y="248" width="128" height="56" rx="6"/><text x="692" y="281" class="center">Isolated</text>
    <text x="404" y="40" class="small">Matching observation</text>
    <path class="control" d="M382 112H610V54H622" marker-end="url(#recovery-en-arrow)"/>
    <text x="404" y="98" class="small">No new sample · no rejection</text>
    <text x="404" y="138" class="secondary small">Expiry · reuse prior baseline</text>
    <path class="route" d="M382 216H610V276H622" marker-end="url(#recovery-en-arrow)"/>
    <text x="404" y="202" class="small">Measured identity drift</text>
    <text x="404" y="262" class="small">Grace expires after rejection</text>
</svg>
