  <path class="door" d="M2-24 23-13"/><path class="traffic" d="M-27 4H27"/>
  <circle class="hinge" cx="2" cy="-24" r="3"/></g>
  <g transform="translate(668 256)">
  <path class="object" d="M-27-24h54v7h-54Z M-27 18h54v6h-54Z"/>
  <path class="door block" d="M2-24V22"/><path class="traffic" d="M-27 4H-10"/><path class="cut" d="m15-2 8 12m0-12-8 12"/>
  <circle class="hinge" cx="2" cy="-24" r="3"/></g>
  <text x="77" y="218" class="center bold">Armed</text>
  <text x="226" y="218" class="center bold">New handshakes wait</text>
  <text x="668" y="129" class="center bold">Armed</text>
  <text x="668" y="304" class="center bold">Isolated</text>
  <text x="151" y="134" class="center secondary">Interruption</text>
  <text x="342" y="40" class="">Matching observation</text>
  <text x="342" y="114" class="">No new sample · no rejection</text>
  <text x="342" y="147" class="secondary">Expiry · reuse prior baseline</text>
  <text x="342" y="216" class="">Measured identity drift</text>
  <text x="342" y="290" class="">Grace expires after rejection</text>
  
</svg>
