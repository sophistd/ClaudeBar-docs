<svg xmlns="http://www.w3.org/2000/svg" width="780" height="330" viewBox="0 0 780 330" xml:lang="en" role="img" aria-labelledby="recovery-en-title recovery-en-desc">
  <!-- [INPUT]: diagram-source.mjs 的双语标注与机制形元。
       [OUTPUT]: recovery 的 en 静态图解。
       [POS]: 文档站 public/diagrams 的生成资源。
       [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md -->
  <title id="recovery-en-title">Gate decisions during a hold</title>
  <desc id="recovery-en-desc">New handshakes wait after an interruption. A matching observation resumes admission. Expiry with no new observation and no probe rejection reuses the prior baseline without reverification. Measured drift isolates immediately, and expiry after a recorded rejection also isolates.</desc>
  <defs>
    <marker id="recovery-en-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path fill="#252422" d="M0 0l10 5-10 5Z"/>
    </marker>
    <marker id="recovery-en-control" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path fill="none" stroke="#496478" stroke-width="1.4" d="m1 1 8 4-8 4"/>
    </marker>
  </defs>
  <style>
    text { font: 15px -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", Arial, sans-serif; fill: #252422; }
    path { stroke-linejoin: round; stroke-linecap: round; }
    .bold { font-size: 16px; font-weight: 650; }
    .secondary { fill: #5f5a54; }
    .center { text-anchor: middle; }
    .end { text-anchor: end; }
    .layer { fill: #f2efe8; stroke: #d4cec2; stroke-width: 1; }
    .rule { fill: none; stroke: #c5bdb1; stroke-width: 1; }
    .object, .hinge { fill: #fcfbf8; stroke: #252422; stroke-width: 1.7; }
    .detail { fill: none; stroke: #6d675e; stroke-width: 1.2; }
    .control { fill: none; stroke: #496478; stroke-width: 1.6; }
    .traffic { fill: none; stroke: #252422; stroke-width: 2.25; }
    .transition { fill: none; stroke: #252422; stroke-width: 1.5; }
    .port { fill: #252422; }
    .seal { fill: #dbe5ea; stroke: #496478; }
    .unknown, .unknown-end { fill: none; stroke: #66625c; stroke-width: 1.6; }
    .unknown { stroke-dasharray: 6 6; }
    .door { fill: none; stroke: #3b604c; stroke-width: 4; }
    .panel { stroke: #736347; }
    .queue { stroke: #736347; stroke-width: 2.5; }
    .block, .cut { fill: none; stroke: #a3442d; }
    .cut { stroke-width: 1.5; }
  </style>
  <rect x=".5" y=".5" width="779" height="329" fill="#fcfbf8" stroke="#d4cec2"/>
  <path class="transition" d="M112 146h77" marker-end="url(#recovery-en-ink)"/>
  <path class="transition" d="M259 146h61m0-96v250 M320 50h258q12 0 12 12v22 M320 124h258q12 0 12-12V84 M590 84h43" marker-end="url(#recovery-en-ink)"/>
  <path class="transition" d="M320 226h258q12 0 12 12v22 M320 300h258q12 0 12-12v-28 M590 260h43" marker-end="url(#recovery-en-ink)"/>
  <path class="port" d="m548 46 8 4-8 4Z m0 74 8 4-8 4Z m0 102 8 4-8 4Z m0 74 8 4-8 4Z"/>
  <circle class="port" cx="320" cy="146" r="3"/>
  <circle class="port" cx="590" cy="84" r="3"/>
  <circle class="port" cx="590" cy="260" r="3"/>
  <g transform="translate(77 171)">
  <path class="object" d="M-27-24h54v7h-54Z M-27 18h54v6h-54Z"/>
  <path class="door" d="M2-24 23-13"/><path class="traffic" d="M-27 4H27"/>
  <circle class="hinge" cx="2" cy="-24" r="3"/></g>
  <g transform="translate(225 171)">
