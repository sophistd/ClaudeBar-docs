<svg xmlns="http://www.w3.org/2000/svg" width="780" height="326" viewBox="0 0 780 326" xml:lang="en" role="img" aria-labelledby="routes-en-title routes-en-desc">
  <!-- [INPUT]: diagram-source.mjs 双语机制与 Geist 视觉标尺。
       [OUTPUT]: routes 的 en 静态机制图。
       [POS]: public/diagrams 的生成资源。
       [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md -->
  <title id="routes-en-title">Two browser launch paths</title>
  <desc id="routes-en-desc">A separately opened browser uses an isolated data folder and the configured gate. Existing sign-in keeps its browser data, receives no gate proxy settings, and follows an unverified network path.</desc>
  <defs><marker id="routes-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="m2 1 6 4-6 4"/></marker></defs>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --surface: #fafafa; --border: #e6e6e6; --ink: #171717; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --surface: #0a0a0a; --border: #333; --ink: #ededed; --muted: #a1a1a1; } }
    text { font: 15px Geist, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .small { font-size: 13px; }
    .secondary { fill: var(--muted); }
    .center { text-anchor: middle; }
    .node { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .route, .control, .arrow { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
    .control { stroke: var(--muted); stroke-dasharray: 4 4; }
    .rule { stroke: var(--border); }
    .endpoint { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; }
    .junction { fill: var(--ink); }
  </style>
  <rect width="780" height="326" fill="var(--bg)"/><text x="32" y="38" class="">Open separately</text>
    <rect class="node" x="32" y="58" width="208" height="56" rx="6"/><text x="136" y="81" class="center">Browser</text><text x="136" y="100" class="center secondary small">Isolated data folder</text>
    <rect class="node" x="310" y="58" width="188" height="56" rx="6"/><text x="404" y="91" class="center">Loopback gate</text>
    <rect class="node" x="568" y="58" width="180" height="56" rx="6"/><text x="658" y="91" class="center">Upstream proxy</text>
    <path class="route" d="M240 86H304" marker-end="url(#routes-en-arrow)"/><path class="route" d="M498 86H562" marker-end="url(#routes-en-arrow)"/>
    <path class="rule" d="M32 158H748"/>
    <text x="32" y="202" class="">Use existing sign-in</text>
    <rect class="node" x="32" y="222" width="208" height="56" rx="6"/><text x="136" y="245" class="center">Browser</text><text x="136" y="264" class="center secondary small">Existing data folder</text>
    <path class="control" d="M240 250H730"/>
    <circle class="endpoint" cx="738" cy="250" r="5"/>
    <text x="498" y="233" class="center secondary small">Unverified network path</text>
</svg>
