<svg xmlns="http://www.w3.org/2000/svg" width="780" height="348" viewBox="0 0 780 348" xml:lang="en" role="img" aria-labelledby="architecture-en-title architecture-en-desc">
  <!-- [INPUT]: diagram-source.mjs 双语机制与 Geist 视觉标尺。
       [OUTPUT]: architecture 的 en 静态机制图。
       [POS]: public/diagrams 的生成资源。
       [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md -->
  <title id="architecture-en-title">Three cooperating layers</title>
  <desc id="architecture-en-desc">A profile informs the egress probe. Verified evidence controls the gate. Managed traffic passes through the loopback gate to the upstream proxy.</desc>
  <defs><marker id="architecture-en-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="m2 1 6 4-6 4"/></marker></defs>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --surface: #fafafa; --border: #e6e6e6; --ink: #171717; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --surface: #0a0a0a; --border: #333; --ink: #ededed; --muted: #a1a1a1; } }
    text { font: 15px Geist, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .small { font-size: 13px; }
    .secondary { fill: var(--muted); }
    .center { text-anchor: middle; }
    .node { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .route, .control, .arrow { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
    .control { stroke: var(--muted); stroke-dasharray: 4 4; }
    .rule { stroke: var(--border); }
    .endpoint { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; }
    .junction { fill: var(--ink); }
  </style>
  <rect width="780" height="348" fill="var(--bg)"/><text x="32" y="42" class="secondary small">Configuration</text>
    <rect class="node" x="32" y="60" width="180" height="56" rx="6"/><text x="122" y="93" class="center">Profile</text>
    <text x="286" y="42" class="secondary small">Observation</text>
    <rect class="node" x="286" y="60" width="180" height="56" rx="6"/><text x="376" y="93" class="center">Egress probe</text>
    <rect class="node" x="540" y="60" width="208" height="56" rx="6"/><text x="644" y="93" class="center">Verified baseline</text>
    <path class="route" d="M212 88H280" marker-end="url(#architecture-en-arrow)"/><path class="route" d="M466 88H534" marker-end="url(#architecture-en-arrow)"/>
    <path class="control" d="M644 116V170H376V226" marker-end="url(#architecture-en-arrow)"/>
    <text x="500" y="157" class="secondary small">Control signal</text>
    <text x="32" y="213" class="secondary small">Runtime control</text>
    <rect class="node" x="32" y="232" width="180" height="56" rx="6"/><text x="122" y="265" class="center">Managed app</text>
    <rect class="node" x="286" y="232" width="180" height="56" rx="6"/><text x="376" y="265" class="center">Loopback gate</text>
    <rect class="node" x="540" y="232" width="208" height="56" rx="6"/><text x="644" y="265" class="center">Upstream proxy</text>
    <path class="route" d="M212 260H280" marker-end="url(#architecture-en-arrow)"/><path class="route" d="M466 260H534" marker-end="url(#architecture-en-arrow)"/>
    <text x="376" y="321" class="center secondary small">Tunnel traffic</text>
</svg>
