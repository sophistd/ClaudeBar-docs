<svg xmlns="http://www.w3.org/2000/svg" width="780" height="348" viewBox="0 0 780 348" xml:lang="zh-CN" role="img" aria-labelledby="architecture-zh-title architecture-zh-desc">
  <!-- [INPUT]: diagram-source.mjs 双语机制与 Geist 视觉标尺。
       [OUTPUT]: architecture 的 zh 静态机制图。
       [POS]: public/diagrams 的生成资源。
       [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md -->
  <title id="architecture-zh-title">ClaudeBar 的三层协作</title>
  <desc id="architecture-zh-desc">配置档案为出口探测提供设置。核验后的证据用于控制门禁。受管应用的流量经本机回环门禁发往上游代理。</desc>
  <defs><marker id="architecture-zh-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path class="arrow" d="m2 1 6 4-6 4"/></marker></defs>
  <style>
    :root { color-scheme: light dark; --bg: #fff; --surface: #fafafa; --border: #e6e6e6; --ink: #171717; --muted: #666; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --surface: #0a0a0a; --border: #333; --ink: #ededed; --muted: #a1a1a1; } }
    text { font: 15px Geist, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; fill: var(--ink); }
    .small { font-size: 13px; }
    .secondary { fill: var(--muted); }
    .center { text-anchor: middle; }
    .node { fill: var(--surface); stroke: var(--border); stroke-width: 1; }
    .route, .control, .arrow { fill: none; stroke: var(--ink); stroke-width: 1.5; stroke-linejoin: round; }
    .control { stroke: var(--muted); stroke-dasharray: 4 4; }
    .rule { stroke: var(--border); }
    .endpoint { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; }
    .junction { fill: var(--ink); }
  </style>
  <rect width="780" height="348" fill="var(--bg)"/><text x="32" y="42" class="secondary small">配置存储</text>
    <rect class="node" x="32" y="60" width="180" height="56" rx="6"/><text x="122" y="93" class="center">配置档案</text>
    <text x="286" y="42" class="secondary small">观测决策</text>
    <rect class="node" x="286" y="60" width="180" height="56" rx="6"/><text x="376" y="93" class="center">出口探测</text>
    <rect class="node" x="540" y="60" width="208" height="56" rx="6"/><text x="644" y="93" class="center">已核验的出口基线</text>
    <path class="route" d="M212 88H280" marker-end="url(#architecture-zh-arrow)"/><path class="route" d="M466 88H534" marker-end="url(#architecture-zh-arrow)"/>
    <path class="control" d="M644 116V170H376V226" marker-end="url(#architecture-zh-arrow)"/>
    <text x="500" y="157" class="secondary small">控制信号</text>
    <text x="32" y="213" class="secondary small">运行控制</text>
    <rect class="node" x="32" y="232" width="180" height="56" rx="6"/><text x="122" y="265" class="center">受管应用</text>
    <rect class="node" x="286" y="232" width="180" height="56" rx="6"/><text x="376" y="265" class="center">本机回环门禁</text>
    <rect class="node" x="540" y="232" width="208" height="56" rx="6"/><text x="644" y="265" class="center">上游代理</text>
    <path class="route" d="M212 260H280" marker-end="url(#architecture-zh-arrow)"/><path class="route" d="M466 260H534" marker-end="url(#architecture-zh-arrow)"/>
    <text x="376" y="321" class="center secondary small">隧道流量</text>
</svg>
