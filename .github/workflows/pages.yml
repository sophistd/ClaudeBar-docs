# [INPUT]: 独立文档仓库 main 的经批准内容、锁定依赖与 GitHub Pages。
# [OUTPUT]: 静态站点构建与部署，不访问私有应用仓库。
# [POS]: 独立仓库唯一发布入口，仓库身份条件避免在应用仓库运行。
#        测试门禁在本地执行（npm run ci），这里只构建与部署，不重复跑 Playwright，PR 不触发。
# [PROTOCOL]: 变更时更新此头部，然后检查 CLAUDE.md
name: Documentation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true
env:
  ASTRO_TELEMETRY_DISABLED: '1'
jobs:
  build:
    if: github.repository == 'sophistd/ClaudeBar-docs'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
